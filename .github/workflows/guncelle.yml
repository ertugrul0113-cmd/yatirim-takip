name: Verileri guncelle

on:
  schedule:
    - cron: "7 * * * *"   # saatte bir
  workflow_dispatch:       # elle çalıştırma düğmesi

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance tefas-crawler pandas numpy requests scikit-learn
      - run: python guncelle.py
      - run: python tahmin.py || echo "tahmin atlandi"
      - name: Kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add data/
          git commit -m "Veri güncellendi" || exit 0
          git pull --rebase
          git push
